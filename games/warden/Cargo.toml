[package]
name = "warden"
version = "0.1.0"
edition = "2021"
description = "Warden —— 塔防游戏（Bevy 0.19，能力卡驱动开发）"

[dependencies]
# Versions are pinned once in the root workspace (ADR-0012); members inherit.
bevy = { workspace = true }
rand = { workspace = true }

# DB1 debug panel (F1, egui). Version per the bevy_egui README support table:
# Bevy 0.19 <-> bevy_egui 0.40-0.42 (we take 0.42.0, which depends on egui 0.36).
# Note: cargo cannot gate a dependency by build profile (a cfg(debug_assertions)
# target table is invalid — warned and ignored), so the dependency itself is
# declared unconditionally. **The gate lives in the code**: all debug code is
# #[cfg(debug_assertions)] and release never references any bevy_egui symbol
# (zero debug surface in release builds — see the DB1 card for the check).
bevy_egui = { workspace = true }

# Generic neutral-studio asset viewer (ADR-0010): mechanisms live in the
# engine crate; Warden only registers its catalog. The gate lives in the code:
# only debug builds reference it.
showroom-viewer = { path = "../../engine/showroom-viewer" }

# Battle runtime base (ADR-0012, WX1): warden consumes the base's damage
# attribution model; the full component-level migration proceeds in
# WX2-WX6 paired increments.
warbase = { path = "../../engine/warbase" }

# SM7 showroom origins parse art-assets.json at runtime (debug-gated use).
serde_json = { workspace = true }

[dev-dependencies]
# Art asset gates (tests/art_assets.rs): parse the GLB JSON chunk offline
# (bbox/counts/animation facts) — already in the dependency tree via Bevy.
serde_json = { workspace = true }

# NOTE: profiles (dev opt-level / release thin-LTO / release-check) moved to
# the root workspace Cargo.toml — member profiles are ignored in a workspace.
