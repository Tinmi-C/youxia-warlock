[package]
name = "warden"
version = "0.1.0"
edition = "2021"
description = "Warden —— 塔防游戏（Bevy 0.19，能力卡驱动开发）"

[dependencies]
# ⚠️ Bevy 版本锁定：迭代快、有 breaking changes。升级看官方 release notes，不要盲目升。
# 模板按 0.19.1 验证（spike: games/bevy-spike）。
bevy = { version = "0.19.1", features = [
    "default_font", # UI 默认字体：不配字体文件也能显示文字（默认已含，显式列出仅为可读性）
    "jpeg",         # glTF 内嵌 JPEG 贴图（CesiumMan 等常见模型需要——spike 踩过的坑）
    # 默认 features 已含：png / ktx2 / vorbis / x11 / wayland 等
] }
# 中文 UI：自带开源中文字体 Noto Sans SC（UI6，SIL OFL 1.1，见 assets/fonts/OFL.txt），
# 渲染跨平台一致、分发无版权问题；不再依赖系统字体发现（bevy_text/system_font_discovery）。
# 第三方插件按需在此追加，注意版本对齐 Bevy 0.19，例如：
# bevy_rapier = "0.29"   # 物理（碰撞/刚体/重力）
rand = "0.10"    # 随机（AC1 开局手牌/AC2 商店刷新/AC3 掉落）；对齐 Bevy 0.19 依赖树内的 rand 0.10，不引入第二版本

# DB1 debug panel (F1, egui). Version per the bevy_egui README support table:
# Bevy 0.19 <-> bevy_egui 0.40-0.42 (we take 0.42.0, which depends on egui 0.36).
# Note: cargo cannot gate a dependency by build profile (a cfg(debug_assertions)
# target table is invalid — warned and ignored), so the dependency itself is
# declared unconditionally. **The gate lives in the code**: all debug code is
# #[cfg(debug_assertions)] and release never references any bevy_egui symbol
# (zero debug surface in release builds — see the DB1 card for the check).
bevy_egui = "0.42"

[dev-dependencies]
# Art asset gates (tests/art_assets.rs): parse the GLB JSON chunk offline
# (bbox/counts/animation facts) — already in the dependency tree via Bevy.
serde_json = "1"

# 迭代友好：依赖开优化（编译一次后运行快），自身代码保持快编译
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
